name: Live Smoke

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    name: Dockerized smoke run (simple_app)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      LIVE_SMOKE_PROJECT: symfony-guard-live-smoke

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bring the smoke stack up (guarded app + redis)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker compose -p "$LIVE_SMOKE_PROJECT" -f examples/simple_app/docker-compose.yml up --build -d --wait

      - name: Run smoke assertions
        run: |
          set -euo pipefail
          base="http://localhost:8080"

          check() {
            local name="$1" expected="$2"; shift 2
            local code body
            body=$(curl -sS --max-time 10 -o /tmp/smoke_body -w '%{http_code}' "$@") || {
              echo "FAIL: $name (curl error)"; exit 1
            }
            code="$body"
            if [ "$code" != "$expected" ]; then
              echo "FAIL: $name (expected $expected, got $code)"
              echo "body: $(cat /tmp/smoke_body)"
              exit 1
            fi
            echo "ok: $name -> $code"
          }

          check "GET / serves"                 200 "$base/"
          check "GET /health (excluded path)"  200 "$base/health"

          # Endpoint rate limit: /rate/strict allows 1 request per 10 seconds.
          check "GET /rate/strict (1st)"       200 "$base/rate/strict"
          code=$(curl -sS --max-time 10 -o /tmp/smoke_body -w '%{http_code}' "$base/rate/strict")
          if [ "$code" != "429" ]; then
            echo "FAIL: /rate/strict 2nd request (expected 429, got $code)"; exit 1
          fi
          grep -q "Too many requests" /tmp/smoke_body || { echo "FAIL: rate limit body"; exit 1; }
          echo "ok: /rate/strict (2nd) -> 429 with default body"

          # Threat ban: the demo config pins the xss threat ban at threshold 1
          # (deterministic under PHP shared-nothing), so the first XSS payload
          # is banned and the verdict carries the custom 403 body.
          code=$(curl -sS --max-time 10 -o /tmp/smoke_body -w '%{http_code}' \
            -G "$base/search" --data-urlencode 'q=<script>alert(1)</script>')
          if [ "$code" != "403" ]; then
            echo "FAIL: XSS query param (expected 403, got $code)"; exit 1
          fi
          grep -q "Blocked by symfony-guard" /tmp/smoke_body || { echo "FAIL: custom 403 body"; exit 1; }
          echo "ok: XSS query param -> 403 custom block"

          # The ban is Redis-backed: the attacker IP is now locked out of the
          # whole app by the ip_security check.
          code=$(curl -sS --max-time 10 -o /tmp/smoke_body -w '%{http_code}' "$base/")
          if [ "$code" != "403" ]; then
            echo "FAIL: banned IP on / (expected 403, got $code)"; exit 1
          fi
          grep -q "Blocked by symfony-guard" /tmp/smoke_body || { echo "FAIL: banned body"; exit 1; }
          echo "ok: banned IP -> 403 with custom error body"

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -p "$LIVE_SMOKE_PROJECT" -f examples/simple_app/docker-compose.yml logs --no-color

      - name: Bring the smoke stack down
        if: always()
        run: |
          docker compose -p "$LIVE_SMOKE_PROJECT" -f examples/simple_app/docker-compose.yml down -v --remove-orphans

  live-smoke-advanced:
    name: Dockerized smoke run (advanced_app)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      LIVE_SMOKE_PROJECT: symfony-guard-live-smoke-advanced

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bring the smoke stack up (guarded app + redis)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker compose -p "$LIVE_SMOKE_PROJECT" -f examples/advanced_app/docker-compose.yml up --build -d --wait

      - name: Run smoke assertions
        run: |
          set -euo pipefail
          base="http://localhost:8081"

          check() {
            local name="$1" expected="$2"; shift 2
            local code body
            body=$(curl -sS --max-time 10 -o /tmp/smoke_body_adv -w '%{http_code}' "$@") || {
              echo "FAIL: $name (curl error)"; exit 1
            }
            code="$body"
            if [ "$code" != "$expected" ]; then
              echo "FAIL: $name (expected $expected, got $code)"
              echo "body: $(cat /tmp/smoke_body_adv)"
              exit 1
            fi
            echo "ok: $name -> $code"
          }

          check "GET / serves"                 200 "$base/"
          check "GET /health (excluded path)"  200 "$base/health"

          # Admin gate: /admin/* requires X-Admin-Token; the example's
          # custom_request check rejects a missing header with 400 before
          # the handler runs.
          code=$(curl -sS --max-time 10 -o /tmp/smoke_body_adv -w '%{http_code}' "$base/admin/check?ip=203.0.113.9")
          if [ "$code" != "400" ]; then
            echo "FAIL: /admin/check without token (expected 400, got $code)"; exit 1
          fi
          grep -q "Missing required header: X-Admin-Token" /tmp/smoke_body_adv || {
            echo "FAIL: missing-token body"; exit 1
          }
          echo "ok: /admin/check without token -> 400 missing required header"

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -p "$LIVE_SMOKE_PROJECT" -f examples/advanced_app/docker-compose.yml logs --no-color

      - name: Bring the smoke stack down
        if: always()
        run: |
          docker compose -p "$LIVE_SMOKE_PROJECT" -f examples/advanced_app/docker-compose.yml down -v --remove-orphans
