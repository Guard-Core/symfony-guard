name: Static Analysis

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    name: PHPStan (level 3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No host PHP toolchain: composer:2 installs the suite, then the
      # phpstan image analyses src/ against the installed autoload.
      - name: Install dependencies (composer:2)
        run: |
          docker run --rm \
            -v "$(dirname "$GITHUB_WORKSPACE")":/work \
            -w "/work/$(basename "$GITHUB_WORKSPACE")" \
            composer:2 sh -c 'composer install --no-interaction --no-progress'

      # Level 3 is the highest level with zero findings on master; the
      # ceiling was probed with this exact image before adopting the job.
      - name: PHPStan analyse (level 3)
        run: |
          docker run --rm \
            -v "$(dirname "$GITHUB_WORKSPACE")":/work \
            -w "/work/$(basename "$GITHUB_WORKSPACE")" \
            ghcr.io/phpstan/phpstan:latest analyse src --level=3 --no-progress
