name: Release Gate

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  test:
    name: Test at tag (php ${{ matrix.php }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout guard-core-php (path repository)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rennf93/guard-core-php
          ref: master
          path: core-checkout
          persist-credentials: false

      - name: Place guard-core-php at the path repository location
        run: mv core-checkout ../guard-core-php

      - name: Resolve guard-core-php from the path repository (CI-only patch)
        run: |
          python3 - <<'EOF'
          import json

          engine = "../guard-core-php/composer.json"
          with open(engine) as f:
              d = json.load(f)
          d["version"] = "4.1.99"
          with open(engine, "w") as f:
              json.dump(d, f, indent=4)
              f.write("\n")

          with open("composer.json") as f:
              d = json.load(f)
          d["repositories"] = [
              repo
              for repo in d.get("repositories", [])
              if not (
                  repo.get("type") == "vcs"
                  and "guard-core-php" in repo.get("url", "")
              )
          ]
          with open("composer.json", "w") as f:
              json.dump(d, f, indent=4)
              f.write("\n")
          EOF

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress
          composer update rennf93/guard-core-php --no-interaction

      - name: php -l sweep
        run: for f in $(find src bin -name '*.php'); do php -l "$f" > /dev/null || exit 1; done && echo LINT_OK

      - name: test_symfony
        env:
          REDIS_HOST: 127.0.0.1
        run: php bin/test_symfony.php

  composer-audit:
    name: Composer audit at tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout guard-core-php (path repository)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rennf93/guard-core-php
          ref: master
          path: core-checkout
          persist-credentials: false

      - name: Place guard-core-php at the path repository location
        run: mv core-checkout ../guard-core-php

      - name: Resolve guard-core-php from the path repository (CI-only patch)
        run: |
          python3 - <<'EOF'
          import json

          engine = "../guard-core-php/composer.json"
          with open(engine) as f:
              d = json.load(f)
          d["version"] = "4.1.99"
          with open(engine, "w") as f:
              json.dump(d, f, indent=4)
              f.write("\n")

          with open("composer.json") as f:
              d = json.load(f)
          d["repositories"] = [
              repo
              for repo in d.get("repositories", [])
              if not (
                  repo.get("type") == "vcs"
                  and "guard-core-php" in repo.get("url", "")
              )
          ]
          with open("composer.json", "w") as f:
              json.dump(d, f, indent=4)
              f.write("\n")
          EOF

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress
          composer update rennf93/guard-core-php --no-interaction

      - name: Composer audit
        run: composer audit
